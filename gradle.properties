# Project-wide Gradle settings.
# Optimized for Low RAM / Memory usage

# Specifies the JVM arguments used for the Gradle daemon process.
# Reduced max heap to 1280m and metaspace to 384m with G1 Garbage Collector.
org.gradle.jvmargs=-Xmx1280m -XX:MaxMetaspaceSize=384m -XX:+UseG1GC -Dfile.encoding=UTF-8

# Run Kotlin compiler inside the Gradle daemon JVM process instead of launching a separate Kotlin daemon process.
# This saves ~1 GB RAM by preventing an extra background JVM.
kotlin.compiler.execution.strategy=in-process

# Limit max parallel worker threads to prevent memory spikes during compilation.
org.gradle.workers.max=2
org.gradle.parallel=false

# Automatically stop the Gradle daemon after 1 minute of inactivity to release RAM back to the system.
org.gradle.daemon.idletimeout=60000

# Enable build cache to avoid re-building unchanged code.
org.gradle.caching=true

# Enable incremental KSP (Kotlin Symbol Processing) to reduce memory overhead.
ksp.incremental=true

# AndroidX package structure
android.useAndroidX=true

# Kotlin code style
kotlin.code.style=official

# Non-transitive R class for smaller memory footprint
android.nonTransitiveRClass=true


